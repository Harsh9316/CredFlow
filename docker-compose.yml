services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credrail
      POSTGRES_PASSWORD: credrail
      POSTGRES_DB: credrail
    ports:
      # Exposed so `npm run dev` on the host can use this database too
      - "5432:5432"
    volumes:
      - credrail-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credrail"]
      interval: 2s
      timeout: 3s
      retries: 30

  credrail:
    build:
      context: .
      args:
        NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://credrail:credrail@db:5432/credrail
      # Leave empty to auto-generate one stored in the data volume.
      SESSION_SECRET: ${SESSION_SECRET:-}
      SEED_DEMO_DATA: "true"
      # Mock data providers so the demo shows bureau, GST and PAN checks. Use "none" or a real provider in production.
      CONNECTOR_BUREAU: mock
      CONNECTOR_GST: mock
      CONNECTOR_KYC: mock
      CONNECTOR_BANK_DATA: mock
      # The image runs with NODE_ENV=production, which refuses mock providers unless allowed
      ALLOW_MOCK_CONNECTORS: "true"
    volumes:
      - credrail-data:/data

volumes:
  credrail-db:
  credrail-data:
