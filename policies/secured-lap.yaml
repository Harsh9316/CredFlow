# Loans against property and other hard collateral.
# More weight on collateral cover, higher LAP LTV, lower approval bar.
# Illustrative starting point only: calibrate against your own portfolio before use.
id: secured-lap
name: Secured loan against property
version: 1.1.0
description: Collateral-led scorecard for LAP and other hard-asset secured loans.

decision:
  approveThreshold: 65
  referThreshold: 50

affordability:
  method: amortized
  annualInterestRate: 13
  minEMICoverage: 1.3
  unsecuredHaircut: 0.8
  collateralHeadroom: 1

scoring:
  cashFlow:
    max: 25
    direction: higher-is-better
    bands:
      - { threshold: 2, points: 25 }
      - { threshold: 1.5, points: 21 }
      - { threshold: 1.2, points: 17 }
      - { threshold: 1, points: 12 }
      - { threshold: 0.8, points: 8 }
    otherwise: 4
  emiCoverage:
    max: 20
    direction: higher-is-better
    bands:
      - { threshold: 2.5, points: 20 }
      - { threshold: 2, points: 17 }
      - { threshold: 1.75, points: 14 }
      - { threshold: 1.5, points: 12 }
      - { threshold: 1.3, points: 9 }
    otherwise: 4
  stability:
    max: 15
    direction: lower-is-better
    bands:
      - { threshold: 0.15, points: 15 }
      - { threshold: 0.25, points: 13 }
      - { threshold: 0.35, points: 10 }
      - { threshold: 0.5, points: 7 }
    otherwise: 3
  collateral:
    max: 30
    coverageBands:
      - { threshold: 1.5, points: 28 }
      - { threshold: 1.2, points: 24 }
      - { threshold: 1, points: 20 }
      - { threshold: 0.8, points: 12 }
      - { threshold: 0.5, points: 6 }
    otherwise: 0
    preferredTypes: [LAP, FD]
    preferredTypeBonus: 2
    personalGuaranteeBonus: 1
  profile:
    max: 10
    vintageBands:
      - { threshold: 60, points: 5 }
      - { threshold: 36, points: 4 }
      - { threshold: 24, points: 3 }
      - { threshold: 12, points: 2 }
    vintageOtherwise: 1
    industryPoints: { LOW: 5, MEDIUM: 3, HIGH: 1 }

collateral:
  ltvLimits: { LAP: 75, MACHINERY: 60, INVOICE: 80, STOCK: 50, FD: 90, NONE: 0 }

industries:
  defaultBand: MEDIUM
  riskBands:
    Manufacturing: LOW
    IT Services: LOW
    Healthcare: LOW
    Retail: MEDIUM
    Construction: MEDIUM
    Agriculture: MEDIUM
    Real Estate: HIGH
    Hospitality: HIGH
    Trading: MEDIUM
    Logistics: MEDIUM
    Food Processing: LOW

explanations:
  strongEMICoverage: 2
  stableInflowCV: 0.25
  maxInflowCV: 0.5
  establishedVintageMonths: 36
  minBusinessVintageMonths: 12

fraud:
  hardStopSeverity: CRITICAL
  rules:
    panGstinMismatch: { severity: CRITICAL }
    missingIdentity: { severity: WARNING }
    inflowSpike: { severity: WARNING, multipleOfAverage: 2.5, minMonths: 3 }
    turnoverBankShortfall: { severity: CRITICAL, minBankToTurnoverRatio: 0.3 }
    excessiveBankFlow: { severity: WARNING, maxBankToTurnoverRatio: 3 }
    newEntityLargeLoan: { severity: WARNING, maxVintageMonths: 6, amountAbove: 2500000 }
    loanExceedsTurnover: { severity: WARNING }

approvals:
  checkerRequiredAbove: 5000000
  checkerRequiredForOverrides: true
  checkerRoles: [ADMIN]

bureau:
  fraudAlertModifier: -100
  delinquencyModifier: -10
  scoreBands:
    - { minScore: 750, modifier: 5 }
    - { minScore: 650, modifier: 0 }
    - { minScore: 500, modifier: -3 }
  otherwiseModifier: -7
